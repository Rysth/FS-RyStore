server {
    listen 5173;
    server_name ${ADMIN_SERVER_NAME};
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Paired with the `set` below, this makes nginx
    # resolve API_UPSTREAM_HOST lazily — on the first request that actually
    # needs it — instead of once at startup. A literal, unvaried proxy_pass
    # target is resolved at boot, and nginx refuses to start at all if that
    # lookup fails; the admin's own cross-origin calls (VITE_API_URL) never
    # touch this proxy, so a deployment that leaves API_UPSTREAM_HOST unset
    # should not be unable to boot over it.
    resolver 127.0.0.11 valid=30s;
    resolver_timeout 5s;

    # Everything the API owns now lives under /api/ (auth included, at
    # /api/v1/auth/*), plus the health check. The long list of bare Rodauth
    # paths this used to carry — login, create-account, reset-password and the
    # rest — no longer exists on the backend.
    location ~ ^/(api/|up) {
        set $api_upstream ${API_UPSTREAM_SCHEME}://${API_UPSTREAM_HOST}:${API_UPSTREAM_PORT};
        proxy_pass $api_upstream;
        proxy_set_header Host ${API_UPSTREAM_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
