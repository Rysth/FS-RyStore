server {
    listen 5173;
    server_name ${ADMIN_SERVER_NAME};
    root /usr/share/nginx/html;
    index index.html;

    # Everything the API owns now lives under /api/ (auth included, at
    # /api/v1/auth/*), plus the health check. The long list of bare Rodauth
    # paths this used to carry — login, create-account, reset-password and the
    # rest — no longer exists on the backend.
    location ~ ^/(api/|up) {
        proxy_pass ${API_UPSTREAM_SCHEME}://${API_UPSTREAM_HOST}:${API_UPSTREAM_PORT};
        proxy_set_header Host ${API_UPSTREAM_HOST};
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
