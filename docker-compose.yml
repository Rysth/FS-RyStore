services:
  admin:
    build:
      context: ./admin
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_STOREFRONT_URL: ${STOREFRONT_URL:-https://tienda.example.com}
    container_name: ${STACK_NAME:-rystore}-admin
    # No host port published on purpose: Traefik reaches this container over
    # the docker network directly, using the label below. On a VPS shared
    # with other client stacks (§9 of AGENTS.md), a fixed host port is a
    # collision waiting to happen — every deployment built from this same
    # template would otherwise fight over the same 5173.
    volumes:
      - ./admin:/app
      - /app/node_modules
    environment:
      - TZ=America/Guayaquil
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=${VITE_API_URL}
      - VITE_STOREFRONT_URL=${STOREFRONT_URL:-https://tienda.example.com}
      - ADMIN_SERVER_NAME=${ADMIN_SERVER_NAME:-admin.example.com}
      - API_UPSTREAM_SCHEME=${API_UPSTREAM_SCHEME:-https}
      - API_UPSTREAM_HOST=${API_UPSTREAM_HOST:-api.example.com}
      - API_UPSTREAM_PORT=${API_UPSTREAM_PORT:-443}
    depends_on:
      - api
    networks:
      - rystore_network
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${STACK_NAME:-rystore}-admin.rule=Host(`${ADMIN_SERVER_NAME:-admin.example.com}`)"
      - "traefik.http.routers.${STACK_NAME:-rystore}-admin.tls=true"
      - "traefik.http.routers.${STACK_NAME:-rystore}-admin.tls.certresolver=letsencrypt"
      - "traefik.http.services.${STACK_NAME:-rystore}-admin.loadbalancer.server.port=5173"

  api:
    build:
      context: ./api
      target: production
    container_name: ${STACK_NAME:-rystore}-api
    # Same reasoning as admin: no host port. PORT below is only the port the
    # Fastify process binds to *inside* the container.
    environment:
      - TZ=America/Guayaquil
      - NODE_ENV=production
      - PORT=3000
      - ADMIN_FRONTEND_URL=${ADMIN_FRONTEND_URL:-https://admin.example.com}
      - ADMIN_ALLOWED_ORIGINS=${ADMIN_ALLOWED_ORIGINS:-https://admin.example.com}
      # CORS for /api/v1/public/*: no credentials, no Authorization header.
      - STOREFRONT_URL=${STOREFRONT_URL:-https://tienda.example.com}
      # Absolute origin asset URLs are built against: the storefront renders
      # server-side inside Docker, so a container hostname would reach the
      # buyer's browser and resolve to nothing.
      - PUBLIC_API_URL=${PUBLIC_API_URL:-https://api.example.com}
      - "DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/${DB_NAME}"
      - "APP_NAME=${APP_NAME:-R&R Template}"
      - CLOUDFLARE_ENDPOINT=${CLOUDFLARE_ENDPOINT}
      - CLOUDFLARE_ACCESS_KEY_ID=${CLOUDFLARE_ACCESS_KEY_ID}
      - CLOUDFLARE_SECRET_ACCESS_KEY=${CLOUDFLARE_SECRET_ACCESS_KEY}
      - CLOUDFLARE_BUCKET_NAME=${CLOUDFLARE_BUCKET_NAME}
      # The public origin every uploaded object's URL is built against
      # (lib/serializers.ts's assetUrl). Without this, a real upload still
      # succeeds — the object lands in the bucket — but every *_url field
      # the API returns for it stays "", since there is nothing to build a
      # link from.
      - CLOUDFLARE_PUBLIC_URL=${CLOUDFLARE_PUBLIC_URL}
      - "SMTP_HOST=${SMTP_HOST}"
      - "SMTP_PORT=${SMTP_PORT}"
      - "SMTP_USER=${SMTP_USER}"
      - "SMTP_PASSWORD=${SMTP_PASSWORD}"
      - "SMTP_FROM=${SMTP_USER}"
      - "SECRET_KEY_BASE=${SECRET_KEY_BASE}"
    # Dependencies are baked into the image, so nothing is installed here. Only
    # migrations and the idempotent RBAC seed run before the server starts.
    command: sh -c "npm run db:deploy && npm run db:seed && exec node src/server.ts"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/up').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    # Postgres is provided externally in production (a Dokploy Database
    # resource, typically), reachable only over dokploy-network — that is
    # why this service joins it, not just its own rystore_network.
    networks:
      - rystore_network
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${STACK_NAME:-rystore}-api.rule=Host(`${API_SERVER_NAME:-api.example.com}`)"
      - "traefik.http.routers.${STACK_NAME:-rystore}-api.tls=true"
      - "traefik.http.routers.${STACK_NAME:-rystore}-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.${STACK_NAME:-rystore}-api.loadbalancer.server.port=3000"

  worker:
    build:
      context: ./api
      target: production
    container_name: ${STACK_NAME:-rystore}-worker
    command: ["node", "src/jobs/worker.ts"]
    environment:
      - TZ=America/Guayaquil
      - NODE_ENV=production
      - ADMIN_FRONTEND_URL=${ADMIN_FRONTEND_URL:-https://admin.example.com}
      - ADMIN_ALLOWED_ORIGINS=${ADMIN_ALLOWED_ORIGINS:-https://admin.example.com}
      - "DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/${DB_NAME}"
      - "APP_NAME=${APP_NAME:-R&R Template}"
      - CLOUDFLARE_ENDPOINT=${CLOUDFLARE_ENDPOINT}
      - CLOUDFLARE_ACCESS_KEY_ID=${CLOUDFLARE_ACCESS_KEY_ID}
      - CLOUDFLARE_SECRET_ACCESS_KEY=${CLOUDFLARE_SECRET_ACCESS_KEY}
      - CLOUDFLARE_BUCKET_NAME=${CLOUDFLARE_BUCKET_NAME}
      # The public origin every uploaded object's URL is built against
      # (lib/serializers.ts's assetUrl). Without this, a real upload still
      # succeeds — the object lands in the bucket — but every *_url field
      # the API returns for it stays "", since there is nothing to build a
      # link from.
      - CLOUDFLARE_PUBLIC_URL=${CLOUDFLARE_PUBLIC_URL}
      - "SMTP_HOST=${SMTP_HOST}"
      - "SMTP_PORT=${SMTP_PORT}"
      - "SMTP_USER=${SMTP_USER}"
      - "SMTP_PASSWORD=${SMTP_PASSWORD}"
      - "SMTP_FROM=${SMTP_USER}"
      - "SECRET_KEY_BASE=${SECRET_KEY_BASE}"
    # The api container owns migrations; the worker waits for it to finish.
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    # Same as api: the database it needs DATABASE_URL to reach lives on
    # dokploy-network, not the stack's own private network.
    networks:
      - rystore_network
      - dokploy-network

  # The buyer-facing shop. Astro SSR, so every page is rendered per request —
  # that is what puts real Open Graph tags in the HTML WhatsApp reads when the
  # shop pastes a product link into a chat.
  storefront:
    build:
      context: ./storefront
      # PUBLIC_API_URL must be a build arg, not only a runtime env: Astro inlines
      # PUBLIC_* into the client bundle at build time, so setting it at runtime
      # leaves the checkout calling an empty origin.
      args:
        PUBLIC_API_URL: ${PUBLIC_API_URL:-https://api.example.com}
        STOREFRONT_URL: ${STOREFRONT_URL:-https://tienda.example.com}
    container_name: ${STACK_NAME:-rystore}-storefront
    environment:
      - TZ=America/Guayaquil
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4321
      - STOREFRONT_URL=${STOREFRONT_URL:-https://tienda.example.com}
      # Server-side rendering talks to the api container directly. Points at the
      # container_name, never the service name "api": on a shared network
      # (dokploy-network) another client's stack registers that same alias and
      # Docker round-robins between them, which shows up as intermittent 403s
      # served from someone else's API.
      - API_INTERNAL_URL=${API_INTERNAL_URL:-http://rystore-api:3000}
      - PUBLIC_API_URL=${PUBLIC_API_URL:-https://api.example.com}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rystore_network
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${STACK_NAME:-rystore}-storefront.rule=Host(`${STOREFRONT_SERVER_NAME:-tienda.example.com}`)"
      - "traefik.http.routers.${STACK_NAME:-rystore}-storefront.tls=true"
      - "traefik.http.routers.${STACK_NAME:-rystore}-storefront.tls.certresolver=letsencrypt"
      - "traefik.http.services.${STACK_NAME:-rystore}-storefront.loadbalancer.server.port=4321"

networks:
  rystore_network:
    driver: bridge
  # Dokploy's own shared network. Every service joins it so Traefik can
  # route to admin/api/storefront, and so api/worker can reach a database
  # created as a separate Dokploy resource (a different container, on this
  # network, not on rystore_network). `external: true` because Dokploy
  # creates this network itself — it must already exist before this stack
  # deploys, which on a Dokploy server it always does.
  dokploy-network:
    external: true
