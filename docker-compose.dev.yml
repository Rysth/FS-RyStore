services:
  admin:
    container_name: ${STACK_NAME:-rystore}-admin
    build:
      context: ./admin
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./admin:/app
      - /app/node_modules
    environment:
      - TZ=America/Guayaquil
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=${VITE_API_URL}
      - VITE_STOREFRONT_URL=${STOREFRONT_URL:-http://localhost:4321}
      - VITE_APP_VERTICAL=${VITE_APP_VERTICAL:-store}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - rystore_network

  api:
    container_name: ${STACK_NAME:-rystore}-api
    build:
      context: ./api
      target: development
    ports:
      - "${PORT}:3000"
    volumes:
      - ./api:/app
      - /app/node_modules
    environment:
      - TZ=America/Guayaquil
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/${DB_NAME}
      - "APP_NAME=${APP_NAME:-R&R Template}"
      - APP_VERTICAL=${APP_VERTICAL:-store}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - ADMIN_FRONTEND_URL=${ADMIN_FRONTEND_URL:-http://localhost:5173}
      - ADMIN_ALLOWED_ORIGINS=${ADMIN_ALLOWED_ORIGINS:-http://localhost:5173}
      # CORS for /api/v1/public/*: no credentials, no Authorization header.
      - STOREFRONT_URL=${STOREFRONT_URL:-http://localhost:4321}
      # Absolute origin asset URLs are built against — the storefront renders
      # server-side inside Docker, so a container hostname is not resolvable
      # from the buyer's browser.
      - PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost:3000}
      # Mailpit accepts anything and shows it at http://localhost:8025.
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_FROM=${SMTP_USER:-no-reply@example.com}
      - CLOUDFLARE_ENDPOINT=${CLOUDFLARE_ENDPOINT}
      - CLOUDFLARE_ACCESS_KEY_ID=${CLOUDFLARE_ACCESS_KEY_ID}
      - CLOUDFLARE_SECRET_ACCESS_KEY=${CLOUDFLARE_SECRET_ACCESS_KEY}
      - CLOUDFLARE_BUCKET_NAME=${CLOUDFLARE_BUCKET_NAME}
      - CLOUDFLARE_PUBLIC_URL=${CLOUDFLARE_PUBLIC_URL:-}
    # Replaces `rails db:prepare`: migrations are applied, then the RBAC seed,
    # which is idempotent and cheap enough to run on every start. db:seed:dev
    # adds the local user fixtures (admin/manager/operator/... — password123)
    # the test suite expects; it refuses to run with NODE_ENV=production and is
    # absent from docker-compose.yml.
    command: sh -c "npm run db:deploy && npm run db:seed && npm run db:seed:dev && npm run dev"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/up').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rystore_network

  worker:
    container_name: ${STACK_NAME:-rystore}-worker
    build:
      context: ./api
      target: development
    command: ["npm", "run", "worker"]
    volumes:
      - ./api:/app
      - /app/node_modules
    environment:
      - TZ=America/Guayaquil
      - NODE_ENV=development
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:5432/${DB_NAME}
      - "APP_NAME=${APP_NAME:-R&R Template}"
      - APP_VERTICAL=${APP_VERTICAL:-store}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - ADMIN_FRONTEND_URL=${ADMIN_FRONTEND_URL:-http://localhost:5173}
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_FROM=${SMTP_USER:-no-reply@example.com}
    # The api container owns migrations; the worker only waits for them.
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - rystore_network

  # The buyer-facing shop. Astro SSR, so every page is rendered per request —
  # that is what puts real Open Graph tags in the HTML WhatsApp reads when the
  # shop pastes a product link into a chat.
  storefront:
    container_name: ${STACK_NAME:-rystore}-storefront
    build:
      context: ./storefront
      dockerfile: Dockerfile.dev
    ports:
      - "4321:4321"
    volumes:
      - ./storefront:/app
      - /app/node_modules
    environment:
      - TZ=America/Guayaquil
      - STOREFRONT_URL=${STOREFRONT_URL:-http://localhost:4321}
      # Server-side rendering talks to the api container directly. Points at the
      # container_name, never the service name "api": on a shared network another
      # client's stack registers that same alias and Docker round-robins between
      # them, which shows up as intermittent 403s from someone else's API.
      - API_INTERNAL_URL=${API_INTERNAL_URL:-http://rystore-api:3000}
      # What the buyer's browser calls (checkout, coupon preview, receipt upload).
      - PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost:3000}
      - PUBLIC_APP_VERTICAL=${PUBLIC_APP_VERTICAL:-store}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - rystore_network

  postgres:
    container_name: ${STACK_NAME:-rystore}-postgres
    image: postgres:16-alpine
    # Do not publish Postgres to host to avoid port conflicts on the dokploy server.
    # Containers on the same compose network can connect to `postgres:5432` internally.
    environment:
      - TZ=America/Guayaquil
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rystore_network

  # Replaces letter_opener_web: development SMTP inbox at http://localhost:8025
  mailpit:
    container_name: ${STACK_NAME:-rystore}-mailpit
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
    environment:
      - TZ=America/Guayaquil
      - MP_MAX_MESSAGES=500
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
    networks:
      - rystore_network

volumes:
  postgres_data:
networks:
  rystore_network:
    driver: bridge
